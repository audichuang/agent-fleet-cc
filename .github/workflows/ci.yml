name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 24, not 22: the codex suite's unref'd-timer tests fail on node >= 22.22
          # ("Promise resolution is still pending but the event loop has already
          # resolved") — reproduced in the standalone codex repo too, so it is an
          # upstream incompatibility, not a migration regression. 24 (active LTS)
          # runs all four suites green and matches antigravity's old CI matrix.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Codex CLI (codex suite + typecheck prereq)
        run: npm install -g @openai/codex
      - name: Vendored shared lib must match source (drift check)
        run: npm run sync-shared && git diff --exit-code
      - run: npm test
      - run: npm run build:codex
